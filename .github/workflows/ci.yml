name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify lib/ is committed and fresh
        run: |
          if ! git diff --quiet lib/; then
            echo "::error::lib/ differs from the committed build — run 'npm run build' and commit before pushing"
            git diff --stat lib/
            exit 1
          fi
